name: Release

# Al crear un tag v* se compilan y prueban los ejecutables en Windows y Linux,
# y se adjuntan al Release: el ejecutable es reproducible y verificable.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutable:
    name: Ejecutable ${{ matrix.nombre }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows
            script: dist:win
            archivos: release/*.exe
          - os: ubuntu-latest
            nombre: Linux
            script: dist:linux
            archivos: release/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      # La app no está firmada: electron-builder no busca certificados.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: La versión del tag coincide con package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm ${{ matrix.script }}
      - name: Probar el ejecutable empaquetado (Linux)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 restringe los espacios de nombres que usa el sandbox de Chromium.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a pnpm test:electron
      - name: Probar el ejecutable empaquetado (Windows)
        if: runner.os == 'Windows'
        run: pnpm test:electron
      - uses: actions/upload-artifact@v4
        with:
          name: ejecutable-${{ matrix.nombre }}
          path: ${{ matrix.archivos }}
          if-no-files-found: error

  publicar:
    name: Publicar el Release
    needs: ejecutable
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binarios
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: binarios/*
          generate_release_notes: true
